name: CI and CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main  
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: mi-app
  REPOSITORY: mi-app
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  MONITORING_CHANNEL_1: ${{ secrets.MONITORING_CHANNEL_1 }}
  CONCURRENCY: 40 # se cambia a 40 para mejorar el rendimiento sin saturar el servicio por defecto son 80

jobs:
  # ─────────────────────────────────────────
  # JOB: CI — Integración Continua
  # ─────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
      security-events: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para sonar-scanner que requiere el historial completo

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # SonarCloud solo corre en push a ramas y pull_request (NO en tags)
      - name: Install SonarScanner
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET tools to PATH
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Limpiar Solución
        run: dotnet clean ServiceDemo.slnx --configuration Release

      - name: Begin Sonar Analysis
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /o:"${{ env.SONAR_ORGANIZATION }}" \
            /d:sonar.token="${{ env.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.opencover.reportsPaths="./TestResults/coverage/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**,**/Program.cs,**/DependencyInjection.cs,src/ServiceDemo.Domain/**,src/ServiceDemo.Infrastructure/Data/ServiceDemoDbContext.cs,src/ServiceDemo.Application/Mappings/**,k6/**," \
            /d:sonar.coverage.exclusions="**/Program.cs,**/DependencyInjection.cs,src/ServiceDemo.Domain/**,src/ServiceDemo.Infrastructure/**,src/ServiceDemo.API/**,src/ServiceDemo.Application/Validators/**,src/ServiceDemo.Application/Common/**"

      - name: Restaurar Dependencias
        run: dotnet restore ServiceDemo.slnx

      - name: Compilar Solución
        run: dotnet build ServiceDemo.slnx --no-restore --configuration Release

      - name: Run Tests with Coverage
        run: |
          dotnet test ServiceDemo.slnx \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Verificar y mover archivo de cobertura
        run: |
          echo "Archivos encontrados:"
          find ./TestResults -name "*.xml" -type f
          mkdir -p ./TestResults/coverage
          find ./TestResults -name "coverage.opencover.xml" -exec cp {} ./TestResults/coverage/coverage.opencover.xml \;
          echo "Archivo copiado:"
          ls -la ./TestResults/coverage/

      - name: End Sonar Analysis
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

      # Build y push de imagen solo en push (no en pull_request)
      - name: Google Auth
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Calcula la versión:
      # - Si es un tag v1.2.3 → usa "1.2.3"
      # - Si es un push normal → usa el SHA del commit
      - name: Calcular versión semántica
        if: github.event_name == 'push'
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            IS_RELEASE="true"
          else
            VERSION="${{ github.sha }}"
            IS_RELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Versión calculada: $VERSION (release: $IS_RELEASE)"

      - name: Build Local Image
        if: github.event_name == 'push'
        run: |
          docker build -t local_image_to_scan:${{ steps.version.outputs.version }} .

      # ── Escaneo de vulnerabilidades con Trivy (instalación manual verificada) ──
      - name: Install Trivy
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.71.1"
          DEB_FILE="trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          CHECKSUMS="trivy_${TRIVY_VERSION}_checksums.txt"
          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          echo "Descargando Trivy v${TRIVY_VERSION}..."
          curl -fsSL --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors \
            -o "${DEB_FILE}" "${BASE_URL}/${DEB_FILE}"

          curl -fsSL --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors \
            -o "${CHECKSUMS}" "${BASE_URL}/${CHECKSUMS}"

          echo "Verificando integridad del paquete..."
          grep -F " ${DEB_FILE}" "${CHECKSUMS}" | sha256sum -c -
          
          echo "Instalando Trivy..."
          sudo dpkg -i "${DEB_FILE}"
          
          rm -f "${DEB_FILE}" "${CHECKSUMS}"
          trivy version
          
      - name: Scan Docker image with Trivy
        if: github.event_name == 'push'
        run: |
          echo "Iniciando escaneo de vulnerabilidades..."
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            --format table \
            local_image_to_scan:${{ steps.version.outputs.version }}

      - name: Push Container to Artifact Registry
        if: github.event_name == 'push'
        run: |
          BASE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}"
          VERSION="${{ steps.version.outputs.version }}"
          
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
          
          docker tag local_image_to_scan:$VERSION $BASE_URL:$VERSION
          docker push $BASE_URL:$VERSION
          
          if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
            docker tag $BASE_URL:$VERSION $BASE_URL:latest
            docker push $BASE_URL:latest
          fi

  # ─────────────────────────────────────────
  # JOB: CD — Despliegue Continuo
  # ─────────────────────────────────────────
  cd:
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Obtener revisión activa antes de desplegar (para rollback)
      - name: Obtener revisión activa actual
        id: current_revision
        run: |
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo " Revisión activa actual: $REVISION"

      # Recalcula la misma versión usada en CI para referenciar la imagen correcta
      - name: Calcular versión para deploy
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Desplegando versión: $VERSION"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ steps.version.outputs.version }}"
          flags: '--allow-unauthenticated --concurrency=${{ env.CONCURRENCY }}'
          secrets: |
            ConnectionStrings__DefaultConnection=connection-string:latest

      # Verificar salud del nuevo deploy (5 intentos cada 10s)
      - name: Verificar salud del deploy
        id: health_check
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")

          echo "Verificando salud en: $SERVICE_URL/health"

          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")
            echo "Intento $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "healthy=true" >> $GITHUB_OUTPUT
              echo "✅ Servicio saludable"
              exit 0
            fi
            sleep 10
          done

          echo "healthy=false" >> $GITHUB_OUTPUT
          echo "❌ Servicio no responde correctamente"
          exit 1

      # Rollback automático si el health check falla
      - name: Rollback automático si falla
        if: failure() && steps.current_revision.outputs.revision != ''
        run: |
          PREV_REVISION="${{ steps.current_revision.outputs.revision }}"
          echo "Deploy fallido. Haciendo rollback a: $PREV_REVISION"

          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --to-revisions=$PREV_REVISION=100

          echo " Rollback completado. Tráfico restaurado a $PREV_REVISION"

      - name: Show Service URL
        run: |
          echo " Deployed at: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')"
          echo " Image version: ${{ steps.version.outputs.version }}"

      # ─────────────────────────────────────────
      # DEPLOY MONITORING (Dashboards and Alerts)
      # ─────────────────────────────────────────
      - name: Deploy Monitoring (Dashboards and Alerts)
        run: |
          set -e
          cd monitoring/

          sed -i "s|CHANNEL_PLACEHOLDER_1|$MONITORING_CHANNEL_1|g" alert-errors.json
          sed -i "s|CHANNEL_PLACEHOLDER_1|$MONITORING_CHANNEL_1|g" alert-latency.json
          sed -i "s|CHANNEL_PLACEHOLDER_1|$MONITORING_CHANNEL_1|g" alert-availability.json

          DASH_DISPLAY_NAME=$(python3 -c "import json; print(json.load(open('dashboard.json'))['displayName'])")
          echo "Buscando Dashboard: '$DASH_DISPLAY_NAME'"
          
          DASH_ID=$(gcloud monitoring dashboards list \
            --project="${{ env.PROJECT_ID }}" \
            --filter="displayName=\"${DASH_DISPLAY_NAME}\"" \
            --format="value(name)" 2>/dev/null | head -n 1)

          if [ -z "$DASH_ID" ]; then
            echo "Creando Dashboard..."
            gcloud monitoring dashboards create --config-from-file=dashboard.json --project="${{ env.PROJECT_ID }}"
          else
            echo "Actualizando Dashboard: $DASH_ID"
            
            ETAG=$(gcloud monitoring dashboards describe "$DASH_ID" --project="${{ env.PROJECT_ID }}" --format="value(etag)")

            jq --arg etag "$ETAG" '.etag = $etag' dashboard.json > dashboard-update.json

            gcloud monitoring dashboards update "$DASH_ID" --config-from-file=dashboard-update.json --project="${{ env.PROJECT_ID }}"
            
          fi

          for file in alert-errors.json alert-latency.json alert-availability.json; do
            POLICY_DISPLAY_NAME=$(python3 -c "import json; print(json.load(open('$file'))['displayName'])")
            echo "Buscando política ($file): '$POLICY_DISPLAY_NAME'"
            
            POLICY_ID=$(gcloud monitoring policies list \
              --project="${{ env.PROJECT_ID }}" \
              --filter="displayName=\"${POLICY_DISPLAY_NAME}\"" \
              --format="value(name)" 2>/dev/null | head -n 1)

            if [ -z "$POLICY_ID" ]; then
              echo "Creando política: $POLICY_DISPLAY_NAME"
              gcloud monitoring policies create --policy-from-file="$file" --project="${{ env.PROJECT_ID }}"
            else
              echo "Actualizando política: $POLICY_ID"
              gcloud monitoring policies update "$POLICY_ID" --policy-from-file="$file" --project="${{ env.PROJECT_ID }}"
            fi
          done